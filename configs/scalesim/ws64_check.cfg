# SCALE-Sim v3 (commit at clone 2026-10-23, numpy<2) cross-check config: 64x64 WS, 4 MB SRAMs, InterfaceBandwidth CALC (stall-free). Compare with results/check_64x64_hbm2/gemm/gemm_cycles.csv
[general]
run_name = smolvla_64x64_ws

[architecture_presets]
ArrayHeight:    64
ArrayWidth:     64
IfmapSramSzkB:   4096
FilterSramSzkB:  4096
OfmapSramSzkB:   4096
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 10
Dataflow : ws
MemoryBanks:   1
ReadRequestBuffer: 32
WriteRequestBuffer: 32

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 10
IfmapSRAMBankNum: 10
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 10
FilterSRAMBankNum: 10
FilterSRAMBankPort: 2

[sparsity]
SparsitySupport : false
SparseRep : ellpack_block
OptimizedMapping : false
BlockSize : 8
RandomNumberGeneratorSeed : 40

[run_presets]
InterfaceBandwidth: CALC
UseRamulatorTrace: False
SRAM_row_size: 2
SRAM_bank_size: 5
DRAM_row_size: 2
DRAM_bank_size: 5
