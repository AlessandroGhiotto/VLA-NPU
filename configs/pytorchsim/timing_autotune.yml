# Same hardware as timing_heuristic.yml, autotune mapping. DO NOT USE for results: autotune picks pointwise/norm
# kernels that TOGSim then times at 0-1 cycles inside a session (9 of 27 kernels in vlm_layer, ~59% of autotune's
# apparent gain; never seen with heuristic mapping). Kept for investigating that bug. If run: TORCHINDUCTOR_COMPILE_THREADS=2
# (set by src/common/torchsim_common.py) and the container capped at 6 GB / 2 CPUs (unthrottled autotune froze the laptop).
num_cores: 1
core_freq_mhz: 940
core_stats_print_period_cycles: 10000
num_systolic_array_per_core: 2

vpu_num_lanes: 128
vpu_spad_size_kb_per_lane: 128
vpu_vector_length_bits: 256

dram_type: ramulator2
dram_freq_mhz: 940
dram_channels: 16
dram_stats_print_period_cycles: 10000
ramulator_config_path: /workspace/PyTorchSim/configs/ramulator2_configs/HBM2_TPUv3.yaml

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 940
icnt_injection_ports_per_core: 16

pytorchsim_functional_mode: 0
pytorchsim_timing_mode: 1

codegen_mapping_strategy: autotune
codegen_external_mapping_file: ''
codegen_compiler_optimization: all
codegen_autotune_max_retry: 10
codegen_autotune_template_topk: 8
