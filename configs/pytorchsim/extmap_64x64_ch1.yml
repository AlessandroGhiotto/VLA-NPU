# Forced tiling (report, time and traffic attribution): same hardware as sweep_bw_64x64_ch1.yml, but mm/addmm tiles from
# mapping_extmap_64x64_ch1.json (src/p1_profiling/make_mapping.py: least DRAM traffic instead of most scratchpad).
num_cores: 1
core_freq_mhz: 1000
core_stats_print_period_cycles: 100000
num_systolic_array_per_core: 1

vpu_num_lanes: 64
vpu_spad_size_kb_per_lane: 64
vpu_vector_length_bits: 256

dram_type: ramulator2
dram_channels: 1
dram_stats_print_period_cycles: 100000
ramulator_config_path: /workspace/PyTorchSim/configs/ramulator2_configs/LPDDR5.yaml

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 1000
icnt_injection_ports_per_core: 1

pytorchsim_functional_mode: 0
pytorchsim_timing_mode: 1

codegen_mapping_strategy: external-then-heuristic
codegen_external_mapping_file: /workspace/3-MDP/configs/pytorchsim/mapping_extmap_64x64_ch1.json
codegen_compiler_optimization: all
codegen_autotune_max_retry: 10
codegen_autotune_template_topk: 4
